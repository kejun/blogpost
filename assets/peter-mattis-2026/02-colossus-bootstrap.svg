<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img"><title>Colossus 怎样打破循环依赖</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006AFF"/></marker></defs><rect width="800" height="650" rx="20" fill="white"/><text x="42" y="58" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" fill="#082B59" font-weight="700" text-anchor="start">Colossus 怎样打破循环依赖</text><text x="42" y="98" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#53677B" font-weight="400" text-anchor="start">早期 bootstrapping 方案 · 箭头表示依赖方向</text><rect x="115" y="144" width="570" height="104" rx="10" fill="#F2F7FF" stroke="#BBD2ED" stroke-width="2"/><text x="400" y="184" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">普通 Bigtable</text><text x="400" y="222" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#53677B" font-weight="400" text-anchor="middle">文件存放在 Colossus</text><rect x="115" y="304" width="570" height="104" rx="10" fill="#F2F7FF" stroke="#BBD2ED" stroke-width="2"/><text x="400" y="344" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">Colossus</text><text x="400" y="382" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#53677B" font-weight="400" text-anchor="middle">metadata 存放在基础 Bigtable</text><rect x="115" y="464" width="570" height="104" rx="10" fill="#F2F7FF" stroke="#BBD2ED" stroke-width="2"/><text x="400" y="504" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">基础 Bigtable</text><text x="400" y="542" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#53677B" font-weight="400" text-anchor="middle">底层存储不依赖 Colossus</text><path d="M400,250 L400,296" stroke="#006AFF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M400,410 L400,456" stroke="#006AFF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="425" y="282" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#082B59" font-weight="400" text-anchor="start">文件存储</text><text x="425" y="442" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#082B59" font-weight="400" text-anchor="start">metadata</text><text x="400" y="616" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#082B59" font-weight="400" text-anchor="middle">将基础实例独立出来，避免启动顺序形成闭环。</text></svg>