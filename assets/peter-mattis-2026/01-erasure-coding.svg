<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 0 800 750" role="img"><title>Erasure coding 为什么更省空间</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006AFF"/></marker></defs><rect width="800" height="750" rx="20" fill="white"/><text x="42" y="58" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" fill="#082B59" font-weight="700" text-anchor="start">Erasure coding 为什么更省空间</text><text x="42" y="98" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#53677B" font-weight="400" text-anchor="start">以 Reed–Solomon 的 5+4 配置为例</text><rect x="42" y="129" width="716" height="70" rx="10" fill="#F2F7FF" stroke="#BBD2ED" stroke-width="2"/><text x="400" y="174" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#082B59" font-weight="700" text-anchor="middle">5 个 data chunk  +  4 个 parity chunk</text><rect x="112" y="240" width="172" height="68" rx="10" fill="#DDEBFF" stroke="#006AFF" stroke-width="2"/><text x="198" y="284" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">D1</text><rect x="314" y="240" width="172" height="68" rx="10" fill="#F0F2F5" stroke="#CAD2DD" stroke-width="2"/><text x="400" y="284" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#91A0B1" font-weight="700" text-anchor="middle">D2</text><path d="M332,254 L468,294" stroke="#9DAAB9" stroke-width="2"/><rect x="516" y="240" width="172" height="68" rx="10" fill="#DDEBFF" stroke="#006AFF" stroke-width="2"/><text x="602" y="284" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">D3</text><rect x="112" y="333" width="172" height="68" rx="10" fill="#F0F2F5" stroke="#CAD2DD" stroke-width="2"/><text x="198" y="377" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#91A0B1" font-weight="700" text-anchor="middle">D4</text><path d="M130,347 L266,387" stroke="#9DAAB9" stroke-width="2"/><rect x="314" y="333" width="172" height="68" rx="10" fill="#DDEBFF" stroke="#006AFF" stroke-width="2"/><text x="400" y="377" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">D5</text><rect x="516" y="333" width="172" height="68" rx="10" fill="#F0F2F5" stroke="#CAD2DD" stroke-width="2"/><text x="602" y="377" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#91A0B1" font-weight="700" text-anchor="middle">P1</text><path d="M534,347 L670,387" stroke="#9DAAB9" stroke-width="2"/><rect x="112" y="426" width="172" height="68" rx="10" fill="#DDEBFF" stroke="#006AFF" stroke-width="2"/><text x="198" y="470" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">P2</text><rect x="314" y="426" width="172" height="68" rx="10" fill="#F0F2F5" stroke="#CAD2DD" stroke-width="2"/><text x="400" y="470" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#91A0B1" font-weight="700" text-anchor="middle">P3</text><path d="M332,440 L468,480" stroke="#9DAAB9" stroke-width="2"/><rect x="516" y="426" width="172" height="68" rx="10" fill="#DDEBFF" stroke="#006AFF" stroke-width="2"/><text x="602" y="470" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#082B59" font-weight="700" text-anchor="middle">P4</text><text x="400" y="542" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#53677B" font-weight="400" text-anchor="middle">灰色表示丢失；这里仍有 5 块可用。</text><path d="M400,558 L400,592" stroke="#006AFF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="110" y="608" width="580" height="62" rx="10" fill="#006AFF" stroke="#006AFF" stroke-width="2"/><text x="400" y="649" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="white" font-weight="700" text-anchor="middle">任意 5 块 → 恢复全部原始数据</text><text x="400" y="713" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#53677B" font-weight="400" text-anchor="middle">编码存储量 9 ÷ 5 = 1.8 倍 · 不含其他开销</text></svg>