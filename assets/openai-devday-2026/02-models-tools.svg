<text x="82" y="400" font-size="25" font-weight="600" fill="#006AFF" text-anchor="start">复杂任务</text>
<text x="82" y="449" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">推理、编程</text><text x="82" y="486" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">视觉与电脑操作</text>
<rect x="426" y="311" width="348" height="206" rx="20" fill="#F2F7FF"/>
<text x="452" y="361" font-size="32" font-weight="700" fill="#082B59" text-anchor="start">GPT-6.1 Sol</text>
<text x="452" y="400" font-size="25" font-weight="600" fill="#006AFF" text-anchor="start">日常主力</text>
<text x="452" y="449" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">接近 Astra 的能力</text><text x="452" y="486" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">强调更低使用成本</text>
<rect x="796" y="311" width="348" height="206" rx="20" fill="#F2F7FF"/>
<text x="822" y="361" font-size="32" font-weight="700" fill="#082B59" text-anchor="start">Luna</text>
<text x="822" y="400" font-size="25" font-weight="600" fill="#006AFF" text-anchor="start">快速决策</text>
<text x="822" y="449" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">通过 Decisions API</text><text x="822" y="486" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">从预定义选项中选择</text>
