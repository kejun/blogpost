<text x="286" y="591" font-size="28" font-weight="400" fill="#FFFFFF" text-anchor="start">加速模式，而不是另一款模型</text>
<text x="56" y="676" font-size="28" font-weight="700" fill="#082B59" text-anchor="start">02  让智能体执行与持续运行</text>
