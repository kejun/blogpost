<text x="1144" y="78" font-size="22" font-weight="500" fill="#48627F" text-anchor="end">02 / 03</text>
<text x="56" y="152" font-size="51" font-weight="700" fill="#082B59" text-anchor="start">开发者平台：模型与执行工具</text>
<text x="56" y="201" font-size="27" font-weight="400" fill="#48627F" text-anchor="start">模型提供能力；运行框架、云端环境与工具负责把任务做完。</text>
