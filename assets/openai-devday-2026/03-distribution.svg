<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">从做出产品，到找到用户</title><desc id="desc">四条并列入口：用户通过Sign in with ChatGPT使用订阅额度；开发者通过插件扩展构建原生应用，并以Sites连接数据；用户从插件库和对话中发现产品；企业通过Marketplace使用已有合同承诺支出购买产品。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#006AFF" stroke-width="1.7"/></marker></defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1200" height="1200" rx="0" fill="#FFFFFF"/>
<rect x="56" y="54" width="9" height="28" rx="4" fill="#006AFF"/>
<text x="82" y="77" font-size="22" font-weight="700" fill="#006AFF" text-anchor="start">OPENAI DEVDAY 2026</text>
<text x="1144" y="78" font-size="22" font-weight="500" fill="#48627F" text-anchor="end">03 / 03</text>
<text x="56" y="152" font-size="51" font-weight="700" fill="#082B59" text-anchor="start">从做出产品，到找到用户</text>
<text x="56" y="201" font-size="27" font-weight="400" fill="#48627F" text-anchor="start">登录、原生应用、发现与企业采购：四种可组合的分发入口。</text>
<path d="M56 233H1144" fill="none" stroke="#D6E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="321" y="264" width="558" height="116" rx="20" fill="#082B59"/>
<text x="600" y="316" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">你构建的产品</text>
<text x="600" y="352" font-size="25" font-weight="400" fill="#D6E8FF" text-anchor="middle">连接用户、团队与企业客户</text>
<path d="M600 386V437" fill="none" stroke="#006AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="56" y="460" width="532" height="270" rx="20" fill="#F2F7FF"/>
<rect x="81" y="483" width="50" height="42" rx="21" fill="#F2F7FF"/><text x="106.0" y="512" font-size="21" font-weight="600" fill="#006AFF" text-anchor="middle">A</text>
<text x="152" y="516" font-size="29" font-weight="700" fill="#082B59" text-anchor="start">把订阅带进应用</text>
<text x="81" y="571" font-size="26" font-weight="600" fill="#006AFF" text-anchor="start">Sign in with ChatGPT</text>
<path d="M81 596H561" fill="none" stroke="#D6E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="81" y="646" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">用户登录你的应用</text><text x="81" y="688" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">使用其 ChatGPT 套餐中的额度</text>
<rect x="612" y="460" width="532" height="270" rx="20" fill="#F2F7FF"/>
<rect x="637" y="483" width="50" height="42" rx="21" fill="#F2F7FF"/><text x="662.0" y="512" font-size="21" font-weight="600" fill="#006AFF" text-anchor="middle">B</text>
<text x="708" y="516" font-size="29" font-weight="700" fill="#082B59" text-anchor="start">在 ChatGPT 内构建</text>
<text x="637" y="571" font-size="26" font-weight="600" fill="#006AFF" text-anchor="start">Plugin extensions + Sites</text>
<path d="M637 596H1117" fill="none" stroke="#D6E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="637" y="646" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">原生编辑器、看板与工作空间</text><text x="637" y="688" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">连接插件和数据，提供个性化体验</text>
<rect x="56" y="770" width="532" height="270" rx="20" fill="#F2F7FF"/>
<rect x="81" y="793" width="50" height="42" rx="21" fill="#F2F7FF"/><text x="106.0" y="822" font-size="21" font-weight="600" fill="#006AFF" text-anchor="middle">C</text>
<text x="152" y="826" font-size="29" font-weight="700" fill="#082B59" text-anchor="start">让用户发现产品</text>
<text x="81" y="881" font-size="26" font-weight="600" fill="#006AFF" text-anchor="start">插件库 + 对话内发现</text>
<path d="M81 906H561" fill="none" stroke="#D6E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="81" y="956" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">在插件库搜索并连接</text><text x="81" y="998" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">在相关对话中发现你的插件</text>
<rect x="612" y="770" width="532" height="270" rx="20" fill="#F2F7FF"/>
<rect x="637" y="793" width="50" height="42" rx="21" fill="#F2F7FF"/><text x="662.0" y="822" font-size="21" font-weight="600" fill="#006AFF" text-anchor="middle">D</text>
<text x="708" y="826" font-size="29" font-weight="700" fill="#082B59" text-anchor="start">触达企业客户</text>
<text x="637" y="881" font-size="26" font-weight="600" fill="#006AFF" text-anchor="start">OpenAI Marketplace</text>
<path d="M637 906H1117" fill="none" stroke="#D6E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="637" y="956" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">企业使用部分既有合同承诺支出</text><text x="637" y="998" font-size="24" font-weight="400" fill="#48627F" text-anchor="start">购买合作伙伴的产品</text>
<text x="56" y="1080" font-size="25" font-weight="500" fill="#082B59" text-anchor="start">这些入口可以组合使用，不代表必须依次完成的接入流程。</text>
<path d="M56 1108H1144" fill="none" stroke="#D6E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="1147" font-size="21" font-weight="400" fill="#48627F" text-anchor="start">根据录音整理稿绘制 · 非官方产品图</text>
<text x="56" y="1177" font-size="19" font-weight="400" fill="#48627F" text-anchor="start">产品状态与数据口径请参见正文及文末校订说明。</text>
</g></svg>
